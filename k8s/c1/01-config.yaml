# Adapted from upstream GoogleCloudPlatform/bank-of-anthos kubernetes-manifests/config.yaml.
# Changes from upstream: namespaced under `boa`; dropped the GKE Workload
# Identity ServiceAccount annotation (not applicable on EKS); local-tier
# addresses stay short in-cluster DNS names, the ledger-tier addresses live
# in 02-service-api-config.yaml, which is a *template* rendered after C2's
# internal NLBs exist (see scripts/render-c1-service-api-config.sh).

apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  namespace: boa
data:
  LOCAL_ROUTING_NUM: "883745000"
  PUB_KEY_PATH: "/tmp/.ssh/publickey"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-data-config
  namespace: boa
data:
  USE_DEMO_DATA: "True"
  DEMO_LOGIN_USERNAME: "testuser"
  # Demo account password, intentionally not secret — matches upstream's own demo setup.
  DEMO_LOGIN_PASSWORD: "bankofanthos"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-of-anthos
  namespace: boa
