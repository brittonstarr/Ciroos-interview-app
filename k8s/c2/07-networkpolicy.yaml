# Pod-level defense-in-depth for C2, layered under the SG rule in
# infra/terraform/modules/peering (which already restricts to C1's private
# subnet CIDRs on the ledger ports at the VPC level) and the fact that C2
# has zero public exposure at the network layer to begin with. This adds a
# third, independent layer: even a Pod that somehow got traffic past the SG
# can only reach the specific ledger-tier Pods, not e.g. ledger-db directly.
#
# 10.10.0.0/16 is C1's VPC CIDR (infra/terraform/variables.tf
# c1_vpc_cidr) — update here if that value changes.
#
# 10.20.0.0/16 (C2's own VPC CIDR) is also admitted below on the same
# ports, for the same reason as the mirrored security-group rule in
# modules/peering: NLB health-check probes for target-type=ip Services
# originate from the NLB's own ENIs inside C2's VPC, not from C1. Without
# this, NetworkPolicy blocks health checks even after the security group
# allows them, every target reports unhealthy, and the NLB drops all
# traffic regardless of whether C1's real requests would otherwise pass.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: boa
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-c1-to-ledger-tier
  namespace: boa
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["ledgerwriter", "balancereader", "transactionhistory"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.0.0/16
        - ipBlock:
            cidr: 10.20.0.0/16 # NLB health checks — see file header
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ledger-tier-to-db
  namespace: boa
spec:
  podSelector:
    matchLabels:
      app: ledger-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ledgerwriter", "balancereader", "transactionhistory"]
      ports:
        - protocol: TCP
          port: 5432
