# Adapted from upstream ledger-writer.yaml. Key change from upstream: the
# Service is `type: LoadBalancer` with AWS Load Balancer Controller
# annotations forcing an *internal* NLB — this is the endpoint C1's
# frontend reaches over the VPC Peering connection (and, in Phase 2, what
# gets wrapped in a VPC Endpoint Service for PrivateLink). No public IP is
# ever allocated for this Service.

apiVersion: v1
kind: Service
metadata:
  name: ledgerwriter
  namespace: boa
  labels:
    application: bank-of-anthos
    team: ledger
    tier: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-name: "boa-challenge-c2-ledgerwriter"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: ledgerwriter
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
  namespace: boa
  labels:
    application: bank-of-anthos
    team: ledger
    tier: backend
spec:
  selector:
    matchLabels:
      app: ledgerwriter
  template:
    metadata:
      labels:
        app: ledgerwriter
        application: bank-of-anthos
        team: ledger
        tier: backend
    spec:
      containers:
        - name: ledgerwriter
          image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledgerwriter:v0.6.10@sha256:eae37de0d9b28fec7534c1ea860868c87279b0a85b405f8fd66c3d7734e3e42f
          env:
            - name: VERSION
              value: v0.6.10
            - name: PORT
              value: "8080"
            - name: BALANCES_API_ADDR
              value: "balancereader:8080" # in-cluster call within C2 — ledgerwriter checks funds via balancereader before writing a transaction
            - name: ENABLE_TRACING
              value: "false" # Stackdriver-only upstream; no GCP ADC available on EKS. Datadog APM is the tracing backend here instead.
            - name: ENABLE_METRICS
              value: "true"
            - name: JVM_OPTS
              value: -XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap -Xms256m -Xmx512m
            - name: LOG_LEVEL
              value: info
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: ledger-db-config
            - secretRef:
                name: ledger-db-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["all"]
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: publickey
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: bank-of-anthos
      terminationGracePeriodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: publickey
          secret:
            secretName: jwt-key
            items:
              - key: jwtRS256.key.pub
                path: publickey
